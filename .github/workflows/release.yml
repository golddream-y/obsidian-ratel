name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build
                  test -f dist/main.js

            # 安全路径:0.1.2 曾误传与 0.1.1 相同的 main.js(仍含 deprecated display()),
            # 被 Obsidian plugin checker 静默拦截。门禁保证 release 产物不含 this.display()。
            - name: Gate — no deprecated display() in bundle
              run: |
                  if grep -q 'this\.display()' dist/main.js; then
                    echo "::error::dist/main.js still contains this.display() — Obsidian plugin checker will reject (no-deprecated-display)"
                    exit 1
                  fi
                  # 声明式设置必须落地:空 stub getSettingDefinitions(){return[]} 也不合格
                  if grep -q 'getSettingDefinitions(){return\[\]}' dist/main.js; then
                    echo "::error::dist/main.js has empty getSettingDefinitions stub — settings migration missing from bundle"
                    exit 1
                  fi
                  echo "release gate passed: no this.display(), getSettingDefinitions is non-empty"

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      dist/main.js
                      manifest.json
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  # Obsidian / BRAT 只安装 main.js + manifest.json + styles.css(可选)。
                  # dist/main.js 上传时 basename 为 main.js(ADR-006: embedding worker 已内联)。
                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    dist/main.js \
                    manifest.json \
                    ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
