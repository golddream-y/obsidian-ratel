name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
            artifact-metadata: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  # 安全路径:package-lock 在 macOS 生成时可能缺 Linux optional 依赖
                  # (@emnapi 等),npm ci 会 EUSAGE。改用 npm install 保证跨平台可装。
                  # 发版只跑 esbuild production — npm run build 还含 tsc/svelte-check,
                  # tests/ 预存 TS 错误会阻断 release(与运行时产物无关)。
                  npm install --no-fund --no-audit
                  node esbuild.config.mjs production
                  test -f dist/main.js

            # 安全路径:0.1.2 曾误传与 0.1.1 相同的 main.js(仍含 deprecated display()),
            # 被 Obsidian plugin checker 静默拦截。门禁保证 release 产物不含 this.display()。
            - name: Gate — no deprecated display() in bundle
              run: |
                  if grep -q 'this\.display()' dist/main.js; then
                    echo "::error::dist/main.js still contains this.display() — Obsidian plugin checker will reject (no-deprecated-display)"
                    exit 1
                  fi
                  # 声明式设置必须落地:空 stub getSettingDefinitions(){return[]} 也不合格
                  if grep -q 'getSettingDefinitions(){return\[\]}' dist/main.js; then
                    echo "::error::dist/main.js has empty getSettingDefinitions stub — settings migration missing from bundle"
                    exit 1
                  fi
                  echo "release gate passed: no this.display(), getSettingDefinitions is non-empty"

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            # 关键路径:Obsidian plugin checker 按 release 资产名(main.js)核对 attestation subject。
            # 若 attest 的是 dist/main.js,商店会报「attestation exists but signature invalid / does not match」。
            # 与 obsidian-sample-plugin 对齐:先落到仓库根再 attest + 上传。
            - name: Stage release artifacts at repo root
              run: |
                  cp dist/main.js main.js
                  test -f main.js
                  test -f manifest.json
                  ls -la main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  # 正式发布(非 draft):社区商店只拉 published release。
                  # 0.1.x 曾因 CI npm ci 失败改为手传包,导致资产与源码不一致。
                  # 禁止手传本地 dist 覆盖 CI 产物 — 会破坏 attestation 与 digest 绑定。
                  gh release create "$tag" \
                    --title="$tag" \
                    --notes-file CHANGELOG.md \
                    main.js \
                    manifest.json \
                    ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
